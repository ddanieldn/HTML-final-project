<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hiking Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="single.css" rel="stylesheet">
</head>
<script src="findsize.js"></script>


<body style="background-color: white;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid d-flex justify-content-end align-items-center">
            <a class="navbar-brand mb-0 h1" href="#">Slick</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                            <button class="btn btn-outline-success" type="submit" style="color: brown;">Search</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="item.html">Shop</a>
                    </li>
                    <li class="nav-item"></li>
                    <!-- Cart Icon with Modal Trigger -->
                    <a class="nav-link" href="cart.html">
                        <i class="bi bi-cart-fill"></i> Cart <span id="cart-count">(0)</span>
                    </a>
                    </li>

                    <!-- Products or list to filter -->

                </ul>
            </div>
        </div>
    </nav>

    <div class="product-container">
        <div class="product-image">
            <img src="https://www.jack-wolfskin.com/dw/image/v2/AAQL_PRD/on/demandware.static/-/Library-Sites-JackWolfskin_SharedContentLib/default/dwf15a705c/background/bone5/1307771_4136_1-alpspitze-hoody-m-slate-green-27.jpg?ox=0&oy=0&oimg=https%3A%2F%2Fwww.jack-wolfskin.com%2Fdw%2Fimage%2Fv2%2FAAQL_PRD%2Fon%2Fdemandware.static%2F-%2FSites-22021_JW_Master%2Fdefault%2Fdw0edf84ba%2Flarge%2F1307771_4136_1-alpspitze-hoody-m-slate-green.png%3Fsw%3D612%26sh%3D882&sfrm=png&sw=612&sh=882"
                alt="Product Image">
        </div>

        <div class="product-details">
            <h2>Alpspitze Hoody M</h2>
            <p class="price">$219.95</p>
            <p class="color">Color: Dust Gray</p>

            <div class="size-selection">
                <div class="product-sizes">
                    <p>Size:</p>
                    <button class="size-button" data-size="XS">XS</button>
                    <button class="size-button" data-size="S">S</button>
                    <button class="size-button" data-size="M">M</button>
                    <button class="size-button" data-size="L">L</button>
                    <button class="size-button" data-size="XL">XL</button>
                    <button class="size-button" data-size="XXL">XXL</button>
                    <button class="size-button" data-size="3XL">3XL</button>
                </div>
                <p id="selected-size">Selected Size: None</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>

    <script>
        // Variable to store the selected size
        let selectedSize = null;

        // Handle size selection
        document.querySelectorAll('.size-button').forEach(button => {
            button.addEventListener('click', function () {
                selectedSize = this.getAttribute('data-size');
                document.getElementById('selected-size').textContent = "Selected Size: " + selectedSize;
            });
        });

        // Function to add items to the cart and store in localStorage
        document.querySelector(".add-to-cart").addEventListener("click", function () {
            if (!selectedSize) {
                alert('Please select a size!');
                return;
            }

            const productName = "Alpspitze Hoody M";
            const productPrice = 219.95;

            // Get the cart from localStorage, or initialize it as an empty array
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            // Check if the item already exists in the cart
            let existingItem = cart.find(item => item.name === productName && item.size === selectedSize);

            if (existingItem) {
                existingItem.quantity += 1; // Increment quantity if it already exists
            } else {
                // Add the new product to the cart with the selected size
                cart.push({ name: productName, price: productPrice, size: selectedSize, quantity: 1 });
            }

            // Save the updated cart to localStorage
            localStorage.setItem("cart", JSON.stringify(cart));

            alert(productName + " (" + selectedSize + ") has been added to your cart!");
        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
</body>

</html>
